services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wb-api-collector
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - wb-network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: wb-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wb-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: wb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wildberries}
      MYSQL_USER: ${DB_USERNAME:-wb_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wb_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wb-network

networks:
  wb-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
